name: CI/CD - Node App with Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ✅ 1. تحميل الكود من الريبو
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ 2. إعداد Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ✅ 3. تثبيت الـ dependencies
      - name: Install dependencies
        run: npm install
        working-directory: .

      #

